<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <header>
        <h1 align="center">Student Registration Form</h1>
    </header>
    <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="dateofbirth">Date of birth:</label>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="gender" name="gender">Male
            <input type="radio" id="gender" name="gender">Female<br><br>

            <label for="course">Course:</label>
            <select name="course" id="course">
                <option>Select</option>
                <option>CSE</option>
                <option>ECE</option>
                <option>CIV</option>
                <option>EEE</option>
                <option>MECH</option>
            </select><br><br>

            
            <p>Skills:</p>
            <input type="checkbox" id="html">HTML
            <input type="checkbox">CSS
            <input type="checkbox">JS
            <input type="checkbox">AWS <br><br>

            <label for="">Address:</label><br>
            <textarea name="" id="" rows="4" cols="30">Enter your address</textarea>
            <br><br>

            <label for="">Resume Upload</label>
            <input type="file"><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="clear">

    </form>
</body>
</html>
