<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1 style="text-align: center;">Job Application Form</h1><hr>

    <form>
        <h2>Personal Information</h2>
        <label for="">Full Name :</label>
        <input type="text" placeholder="Enter your full name" required><br><br>

        <label for="">Email :</label>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label for="">Phone :</label>
        <input type="tel" placeholder="Enter your nnumber"><br><br>

        <label for="">Date of Birth :</label>
        <input type="date"><br><br>

        <label for="">Gender :</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other <br><br>

        <label for="">Position Applying for :</label>
        <select name="" id="">
            <option value="">Select</option>
            <option value="">Frontend Developer</option>
            <option value="">Backend Developer</option>
            <option value="">Full Stack Developer</option>
            <option value="">Cloud Engineer</option>
            <option value="">Data Analyst</option>
        </select><br><br>

        <h2>Technical Skills :</h2>
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">Js
        <input type="checkbox">Python
        <input type="checkbox">Java
        <input type="checkbox">Aws <br><br>

        <label for="">Work experience :</label><br>

        <textarea rows="5" cols="30" placeholder="Describe your experience"></textarea><br><br>

        <label for="">Expected Salary :</label>
        <input type="number"><br><br>

        <label for="">Upload resume</label>
        <input type="file"><br><br>

        <label for="">LinkedIn :</label>
        <input type="url" placeholder="https://linkedin.com/in/yourprofile"><br><br>

        <label for="">Portfolio Website :</label>
        <input type="url" placeholder="https://portfolio.com"><br><br>

        <label for="">Cover Letter :</label>
        <br>
        <textarea rows="5" cols="30" placeholder="Why should we hire you?"></textarea><br><br>

        <input type="submit" value="Apply">
        <input type="reset" value="Clear">



    </form>
</body>
</html>
