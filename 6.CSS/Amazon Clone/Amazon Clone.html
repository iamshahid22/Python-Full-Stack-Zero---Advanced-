<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="Amazon.css">
</head>
<body>

    <header>
        <h1>Amazon Clone</h1>

        <nav>
            <a href="#">Home</a> |
            <a href="#">Products</a> |
            <a href="#">Cart</a> |
            <a href="#">Orders</a>
        </nav>

        <form>
            <input type="text" placeholder="Search Products">
            <button>Search</button>
        </form>
    </header>

    <hr>

    <main>

        <section>
            <h2>Featured Products</h2>

            <article>
                <img src="laptop.jpg" alt="Laptop" width="200">
                <h3>Laptop</h3>
                <p>₹50,000</p>
                <button>Add to Cart</button>
            </article>

            <article>
                <img src="phone.jpg" alt="Phone" width="200">
                <h3>Smartphone</h3>
                <p>₹25,000</p>
                <button>Add to Cart</button>
            </article>

            <article>
                <img src="headphones.jpg" alt="Headphones" width="200">
                <h3>Headphones</h3>
                <p>₹2,000</p>
                <button>Add to Cart</button>
            </article>

        </section>

        <hr>

        <section>
            <h2>Categories</h2>

            <ul>
                <li>Electronics</li>
                <li>Fashion</li>
                <li>Books</li>
                <li>Home Appliances</li>
            </ul>
        </section>

    </main>

    <hr>

    <footer>
        <p>© 2026 Amazon Clone</p>
    </footer>

</body>
</html>
